name: Component tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install core dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Engine regression
        run: python -m unittest discover -s scripts/engine -p 'test_*.py'
      - name: Portable interface
        run: python -m unittest discover -s scripts -p test_skill.py
      - name: Contract checks
        run: python scripts/engine/test_contract.py
